<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box hidden">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>

      <div id="start-screen" class="records-screen hidden">
        <p class="records-title">TETRIS</p>
        <div class="records-stats">
          <span>Mejor combo: <b id="start-best-combo">0</b></span>
          <span>Líneas máximas: <b id="start-max-lines">0</b></span>
        </div>
        <table class="records-table">
          <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th></tr></thead>
          <tbody id="start-scores"></tbody>
        </table>
        <button id="play-btn">JUGAR</button>
      </div>

      <div id="gameover-screen" class="records-screen hidden">
        <p class="records-title records-over">GAME OVER</p>
        <p class="records-final">Puntuación: <b id="go-score">0</b></p>
        <div id="go-name-row" class="records-name-row hidden">
          <input type="text" id="go-name" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="go-save">Guardar</button>
        </div>
        <table class="records-table">
          <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th></tr></thead>
          <tbody id="go-scores"></tbody>
        </table>
        <div class="records-actions">
          <button id="go-restart">Reiniciar</button>
          <button id="go-reset">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
